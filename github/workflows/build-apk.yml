# SignVoice — cloud APK build (GitHub Actions).
#
# Local Gradle builds are blocked on the dev VM (the forked Gradle daemon
# dies instantly), so this workflow is the build path: push to main and
# the debug APK lands as an artifact. No signing configured — this is a
# direct-install debug build, matching the Android-first plan.
#
# Repo layout assumption: the repo root IS the Flutter project root
# (i.e. push the contents of signvoice_app/, not the folder itself).

name: Build SignVoice APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter 3.47.8
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.8'
      - name: Install dependencies
        run: flutter pub get
      - name: Analyse
        run: flutter analyze
      - name: Build debug APK
        run: flutter build apk --debug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: signvoice-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
